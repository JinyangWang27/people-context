name: Release Obsidian plugin

# Development stays in this monorepo; Obsidian's community distribution expects a dedicated
# repository whose root holds `manifest.json` and whose releases carry `main.js`,
# `manifest.json`, and `styles.css`. This workflow builds that tree deterministically from a
# tag and mirrors it.
#
# The plugin has its own version domain, so it has its own tag prefix: pushing
# `obsidian-plugin-v0.1.0` releases plugin 0.1.0 and says nothing about the server release.
#
# The mirror step is configuration-gated. Without a configured destination the workflow still
# produces and publishes the verified artifacts, and the mirror is left as the documented
# user-operated step described in docs/obsidian-plugin.md.

on:
  push:
    tags:
      - "obsidian-plugin-v*"
  workflow_dispatch:

permissions: read-all

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify the distribution tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      # This gate runs for every event, dispatches included. A manual dispatch is a retry of
      # an existing plugin tag, never a way to publish whatever a branch currently holds: the
      # mirror job replaces the distribution repository's tree and cuts a release from it.
      - name: Require a plugin tag matching the manifest version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        working-directory: ./obsidian-plugin
        run: |
          if [[ "$RELEASE_REF" != refs/tags/obsidian-plugin-v* ]]; then
            echo "::error::Run this workflow from an obsidian-plugin-v* tag, not $RELEASE_REF."
            exit 1
          fi
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$manifest_version" != "$package_version" ]; then
            echo "::error::manifest.json ($manifest_version) and package.json ($package_version) disagree."
            exit 1
          fi
          if [ "$RELEASE_NAME" != "obsidian-plugin-v${manifest_version}" ]; then
            echo "::error::Tag $RELEASE_NAME does not match manifest version $manifest_version."
            exit 1
          fi

      - name: Install dependencies from the committed lockfile
        working-directory: ./obsidian-plugin
        run: npm ci --no-audit --no-fund

      - name: Type-check and test
        working-directory: ./obsidian-plugin
        run: |
          npm run typecheck
          npm test

      - name: Build the distributable tree
        working-directory: ./obsidian-plugin
        run: |
          npm run build
          (cd build && sha256sum main.js manifest.json styles.css) > "${RUNNER_TEMP}/first.sha256"

      - name: Rebuild from a second clean lockfile installation
        working-directory: ./obsidian-plugin
        run: |
          rm -rf node_modules build
          npm ci --no-audit --no-fund
          npm run build
          (cd build && sha256sum main.js manifest.json styles.css) > "${RUNNER_TEMP}/second.sha256"

      - name: Require byte-identical release artifacts
        run: diff -u "${RUNNER_TEMP}/first.sha256" "${RUNNER_TEMP}/second.sha256"

      - name: Assemble the mirror tree
        run: |
          mkdir -p mirror
          cp obsidian-plugin/build/main.js mirror/main.js
          cp obsidian-plugin/build/manifest.json mirror/manifest.json
          cp obsidian-plugin/build/styles.css mirror/styles.css
          cp obsidian-plugin/README.md mirror/README.md
          cp LICENSE mirror/LICENSE
          cp "${RUNNER_TEMP}/first.sha256" mirror/SHA256SUMS

      - name: Store the mirror tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obsidian-plugin-mirror
          path: mirror/
          if-no-files-found: error

  mirror:
    name: Mirror to the community-distribution repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download the mirror tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: obsidian-plugin-mirror
          path: mirror/

      - name: Report when no mirror destination is configured
        if: vars.OBSIDIAN_PLUGIN_MIRROR_REPO == ''
        run: |
          echo "::notice::No OBSIDIAN_PLUGIN_MIRROR_REPO repository variable is set."
          echo "::notice::The verified tree is attached as the obsidian-plugin-mirror artifact;"
          echo "::notice::publish it manually as described in docs/obsidian-plugin.md."

      - name: Push the tree and release to the mirror repository
        if: vars.OBSIDIAN_PLUGIN_MIRROR_REPO != ''
        env:
          MIRROR_REPO: ${{ vars.OBSIDIAN_PLUGIN_MIRROR_REPO }}
          # A token scoped to the mirror repository only. It is never used against this
          # repository, and the workflow's own GITHUB_TOKEN stays read-only.
          GH_TOKEN: ${{ secrets.OBSIDIAN_PLUGIN_MIRROR_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::OBSIDIAN_PLUGIN_MIRROR_REPO is set but OBSIDIAN_PLUGIN_MIRROR_TOKEN is not."
            exit 1
          fi
          version="$(node -p "require('./mirror/manifest.json').version")"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${MIRROR_REPO}.git" checkout
          # The mirror is a projection of this tag, not an accumulating history: every
          # tracked file is replaced so a removed asset cannot survive in the mirror.
          find checkout -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp mirror/main.js mirror/manifest.json mirror/styles.css mirror/README.md \
            mirror/LICENSE mirror/SHA256SUMS checkout/
          cd checkout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::The mirror already matches this tag."
          else
            git commit -m "chore: mirror people-context Obsidian plugin ${version}"
            git push origin HEAD
          fi
          # Obsidian resolves a community plugin by a release tag equal to the manifest
          # version, with no prefix, so the mirror tag is the bare version and not RELEASE_REF.
          gh release create "${version}" \
            --repo "${MIRROR_REPO}" \
            --title "${version}" \
            --notes "Mirrored from ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${RELEASE_REF})." \
            main.js manifest.json styles.css
