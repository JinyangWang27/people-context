name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # The encrypted extra is marked for Linux x86_64, which this runner is.
      # Without this check a resolution or marker mistake would silently downgrade
      # every encryption test to a skip instead of failing the build.
      - name: Verify the encrypted extra installed
        run: uv run --locked python -c "import sqlcipher3"

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Verify package distributions
        run: |
          uv lock --check
          uv build
          uvx --from twine==7.0.0 twine check dist/*

      - name: Run tests with coverage
        run: uv run --locked --with pytest-cov==7.1.0 pytest --cov=people_context --cov-report=xml -q

      - name: Upload coverage to Codecov
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true
